name: Sync Freqtrade to Aliyun ACR

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Pull source image
        run: docker pull freqtradeorg/freqtrade:latest

      - name: Tag image
        run: |
          docker tag freqtradeorg/freqtrade:latest \
            registry.cn-hangzhou.aliyuncs.com/wenyun/freqtrade:latest

      - name: Login to Aliyun ACR
        run: |
          echo "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}" | docker login \
            registry.cn-hangzhou.aliyuncs.com \
            --username "${{ secrets.ALIYUN_REGISTRY_USER }}" \
            --password-stdin

      - name: Push to Aliyun ACR
        run: docker push registry.cn-hangzhou.aliyuncs.com/wenyun/freqtrade:latest
